name: qt-2048-snap
base: core24
version: '4.1'
summary: Single player puzzle game.
description: |
  2048 is a single-player puzzle game in which the objective is to slide numbered tiles on
  a grid to combine them and create a tile with the number 2048.

grade: stable
confinement: strict
icon: snap/gui/icon.png

platforms:
  amd64:
  arm64:

apps:
  qt-2048-snap:
    command: usr/bin/2048-qt
    extensions: [kde-neon-6]
    desktop: usr/share/applications/2048-qt.desktop
    environment:
      # Chromium's own sandbox cannot start inside strict snap confinement;
      # the snap confinement itself provides the isolation.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    plugs:
      - browser-support
      - opengl
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/2048-qt.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/2048-qt.desktop
